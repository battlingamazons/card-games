<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b3d24" />
    <title>Card Games</title>
    <style>
      :root {
        color-scheme: dark;
        --felt: #0b3d24;
        --felt-dark: #082c1a;
        --ink: #f4f4f2;
        --muted: #b9c9bd;
        --accent: #d4af37;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: radial-gradient(ellipse at center, var(--felt) 0%, var(--felt-dark) 100%);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      main {
        max-width: 480px;
        margin: 0 auto;
        padding: 48px 20px;
      }
      h1 {
        text-align: center;
        font-size: 24px;
        margin-bottom: 6px;
      }
      p.subtitle {
        text-align: center;
        color: var(--muted);
        font-size: 14px;
        margin-top: 0;
        margin-bottom: 32px;
      }
      .game-list {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .game-card {
        display: block;
        text-decoration: none;
        color: var(--ink);
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 14px;
        padding: 18px 20px;
        transition: transform 0.12s ease, background 0.12s ease;
      }
      .game-card:active {
        transform: scale(0.98);
      }
      .game-card h2 {
        margin: 0 0 4px;
        font-size: 18px;
      }
      .game-card p {
        margin: 0;
        color: var(--muted);
        font-size: 13px;
      }
      .game-card .emoji {
        font-size: 28px;
        margin-bottom: 8px;
        display: block;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Card Games</h1>
      <p class="subtitle">No ads. Add any of these to your Home Screen to play like an app.</p>
      <div class="game-list">
        <a class="game-card" href="./gin-rummy/">
          <span class="emoji">♠️♥️</span>
          <h2>Gin Rummy</h2>
          <p>Play against a computer opponent, full authentic scoring.</p>
        </a>
        <a class="game-card" href="./solitaire/">
          <span class="emoji">🂡♦️</span>
          <h2>Solitaire</h2>
          <p>Classic Klondike, draw three, with auto-complete when you've won.</p>
        </a>
      </div>
    </main>
  </body>
</html>
